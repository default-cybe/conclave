name: Android

on:
  push:
    branches: ["**"]
    paths:
      - "packages/android/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "packages/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # the default list includes the retired "tools" package, which no longer resolves
          packages: platform-tools

      - name: Install SDK packages
        run: |
          # AGP also downloads missing packages on demand; this just makes it explicit.
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-37" \
            || sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-37.0" \
            || echo "SDK platform install failed here, AGP will try again during the build"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "CONCLAVE_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "CONCLAVE_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # a test build installs over a release (same key, higher versionCode) without uninstalling
      - name: Version for a test build
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "CONCLAVE_VERSION_NAME=test-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "CONCLAVE_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # the release build too (unsigned here): R8 shrinking only happens there, and it broke v0.2.0's scanner
      - name: Test client and build debug and release APKs
        run: ./gradlew --no-daemon -Pconclave.app=true :client:test :app:assembleDebug :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conclave-debug-apk
          path: packages/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload client test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-test-report
          path: packages/android/client/build/reports/tests/test

      - name: Decode release keystore
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: the release gets the debug APK instead."
          fi

      - name: Build signed release APK
        if: github.event_name == 'push' && env.ANDROID_KEYSTORE_PATH != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -Pconclave.app=true :app:assembleRelease

      # every push: the signed, shrunk APK to try on a phone before a release (Actions, this run, Artifacts)
      - name: Upload test APK
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conclave-test-apk
          path: |
            packages/android/app/build/outputs/apk/release/*-release.apk
            packages/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 14

      # R8's mapping turns a release crash (ad1.run, y56.a) back into real names; see android-retrace.yml
      - name: Keep the R8 mapping
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapping-${{ github.ref_name }}
          path: packages/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Collect release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          if ls app/build/outputs/apk/release/*-release.apk > /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*-release.apk "$RUNNER_TEMP/dist/conclave-${GITHUB_REF_NAME}.apk"
          else
            cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/dist/conclave-${GITHUB_REF_NAME}-debug.apk"
          fi
          rm -f "$RUNNER_TEMP/release.jks"
          ls -la "$RUNNER_TEMP/dist"

      - name: Hand the APK to the release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-apk
          path: ${{ runner.temp }}/dist/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # only this tag-only job gets a write token; branch and PR builds stay read-only
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-apk
          path: ${{ runner.temp }}/dist

      - name: Attach APK to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/*.apk -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/*.apk -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
