[package]
name = "conclave-desktop"
version = "0.1.0"
description = "Conclave desktop app: a window, tray and quick ask for your Conclave hub"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# macos-private-api: a transparent meeting overlay on macOS (src/meeting/mod.rs build)
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-deep-link = "2.6"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2.7"
# Updates from the signed latest.json on the public releases (src/update.rs, docs/DESIGN.md, Updates)
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
# the hub on this computer (src/local.rs): SHA-256 of the download, and the
# hub's Ed25519 key proof before a token goes to a local port. ureq's TLS
# already brings ring, so this adds no new code to the build.
ring = "0.17"
base64 = "0.22"
# Meeting mode (src/meeting/, docs/design/MEETING-MODE.md 2.1): mic and
# system sound (cpal), the rings between the audio callback and the workers,
# the VAD (silero, as Meetily uses it) and Parakeet speech to text (ort).
cpal = "0.18"
ringbuf = "0.4"
silero_rs = { git = "https://github.com/emotechlab/silero-rs", rev = "26a6460", package = "silero" }
# the same ort silero pins, so one ONNX Runtime is linked
ort = "=2.0.0-rc.10"
ndarray = "0.16"
regex = "1"
once_cell = "1"
thiserror = "2"
log = "0.4"
# cloud speech to text (src/meeting/cloud.rs): a blocking websocket per channel to
# AssemblyAI or Deepgram over the rustls, ring and webpki roots ureq already brings
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# the terminal command's folder on the user's PATH (src/terminal.rs, src/winpath.rs):
# the same registry crate the deep-link and autostart plugins already bring
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
# meeting overlay: display affinity, window styles, the share-detection window scan
# (src/meeting/exclude_win.rs, share_watch.rs); the version tauri already pulls
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
# meeting overlay: acrylic behind it on Windows 11 (src/meeting/mod.rs build); both already in
# the tree through tauri and tao
window-vibrancy = "0.8"
windows-version = "0.1"

# meeting overlay on macOS: sharingType, panel level and collection behaviour,
# the window list for share detection (src/meeting/exclude_mac.rs, share_watch.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSPanel", "NSResponder", "NSWindow", "NSGraphics"] }
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", features = ["CGWindow"] }
tauri-nspanel = "2.1"
# the blur behind the translucent overlay (src/meeting/mod.rs build), the crate tauri already uses
window-vibrancy = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
