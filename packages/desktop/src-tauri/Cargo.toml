[package]
name = "conclave-desktop"
version = "0.1.0"
description = "Conclave desktop app: a window, tray and quick ask for your Conclave hub"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-deep-link = "2.6"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2.7"
# Updates from the signed latest.json on the public releases (src/update.rs, docs/DESIGN.md, Updates)
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
# the hub on this computer (src/local.rs): SHA-256 of the download, and the
# hub's Ed25519 key proof before a token goes to a local port. ureq's TLS
# already brings ring, so this adds no new code to the build.
ring = "0.17"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# the terminal command's folder on the user's PATH (src/terminal.rs, src/winpath.rs):
# the same registry crate the deep-link and autostart plugins already bring
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
