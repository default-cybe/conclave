# The Xcode project is generated from this file with XcodeGen (version pinned in
# .github/workflows/ios.yml). Run `xcodegen` in packages/ios; Conclave.xcodeproj is not committed.
name: Conclave
options:
  bundleIdPrefix: dev.conclave
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  ConclaveKit:
    path: ConclaveKit
  # exact versions: 0.7.2 and later need swift-tools 6.2 (Xcode 26); CI builds with Xcode 16.4.
  # swift-cmark is listed only to pin swift-markdown's own dependency.
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    exactVersion: 0.7.1
  cmark:
    url: https://github.com/swiftlang/swift-cmark
    exactVersion: 0.7.1
targets:
  Conclave:
    type: application
    platform: iOS
    sources: [App/Sources]
    dependencies:
      - package: ConclaveKit
      - package: Markdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.conclave.app
        PRODUCT_NAME: Conclave
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Conclave
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Conclave uses the camera to scan your hub's pairing QR code."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: App/Info.plist
      properties:
        # one chat per window on iPad (Stage Manager, Split View)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.conclave.app
            CFBundleURLSchemes: [conclave]
  ConclaveTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Conclave
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.conclave.app.tests
schemes:
  Conclave:
    build:
      targets:
        Conclave: all
        ConclaveTests: [test]
    test:
      targets: [ConclaveTests]
