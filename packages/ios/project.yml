# The Xcode project is generated from this file with XcodeGen (version pinned in
# .github/workflows/ios.yml). Run `xcodegen` in packages/ios; Conclave.xcodeproj is not committed.
name: Conclave
options:
  bundleIdPrefix: dev.conclave
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  ConclaveKit:
    path: ConclaveKit
  # exact versions: 0.7.2 and later need swift-tools 6.2 (Xcode 26); CI builds with Xcode 16.4.
  # swift-cmark is listed only to pin swift-markdown's own dependency.
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    exactVersion: 0.7.1
  cmark:
    url: https://github.com/swiftlang/swift-cmark
    exactVersion: 0.7.1
targets:
  Conclave:
    type: application
    platform: iOS
    # Resources: Mona Sans and JetBrains Mono (SIL OFL, from the Android app), the launch knot and
    # ground (packages/mobile/assets, made by scripts/brand/knot.ts), the accent, makers' logos (@lobehub, MIT)
    sources: [App/Sources, App/Resources]
    dependencies:
      - package: ConclaveKit
      - package: Markdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.conclave.app
        PRODUCT_NAME: Conclave
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Conclave
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSCameraUsageDescription: "Conclave uses the camera to scan your hub's pairing QR code and to take photos you send in a chat."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: App/Info.plist
      properties:
        # one chat per window on iPad (Stage Manager, Split View)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.conclave.app
            CFBundleURLSchemes: [conclave]
        # the knot on the app's ground, light and dark, as on Android and the Capacitor app
        UILaunchScreen:
          UIColorName: Ground
          UIImageName: Splash
          UIImageRespectsSafeAreaInsets: false
        UIAppFonts:
          - mona_sans_regular.ttf
          - mona_sans_medium.ttf
          - mona_sans_semibold.ttf
          - jetbrains_mono_regular.ttf
          - jetbrains_mono_medium.ttf
          - jetbrains_mono_bold.ttf
  ConclaveTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Conclave
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.conclave.app.tests
  ConclaveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Conclave
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.conclave.app.uitests
        TEST_TARGET_NAME: Conclave
schemes:
  Conclave:
    build:
      targets:
        Conclave: all
        ConclaveTests: [test]
    test:
      targets: [ConclaveTests]
  # CI screenshots against the mock hub (UITests/ScreenshotTests.swift)
  Screenshots:
    build:
      targets:
        Conclave: all
        ConclaveUITests: [test]
    test:
      targets: [ConclaveUITests]
