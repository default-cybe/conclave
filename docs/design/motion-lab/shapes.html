<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shapes and Marks</title>
<style>
  @font-face { font-family: 'Mona Sans Variable'; src: url(fonts/mona-sans-latin-standard-normal.woff2) format('woff2'); font-weight: 200 900; font-stretch: 75% 125%; }
  @font-face { font-family: 'JetBrains Mono Variable'; src: url(fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2'); font-weight: 100 800; }
  /* app tokens (packages/web/src/styles/index.css) as sRGB hex, so canvas and HTML agree */
  :root, .th-dark {
    --bg: #0e0e10; --sunk: #08080b; --raise: #151518; --hover: #19191d; --rule: #242428; --rule-2: #36363b;
    --fg: #ececef; --fg-2: #b2b2b8; --fg-3: #828289; --fg-4: #626269;
    --signal: #c6a2f7; --warn: #f2be62; --fault: #f1756c; --ok: #71d29d;
    color-scheme: dark;
  }
  .th-light {
    --bg: #f9f9fa; --sunk: #f1f1f4; --raise: #ffffff; --hover: #eeeef1; --rule: #dfdfe3; --rule-2: #c3c3c9;
    --fg: #17171c; --fg-2: #48484f; --fg-3: #686870; --fg-4: #85858c;
    --signal: #7a4aba; --warn: #a66000; --fault: #cc3430; --ok: #007e46;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0e0e10; }
  body { color: var(--fg); font: 14px/1.45 'Mona Sans Variable', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'JetBrains Mono Variable', ui-monospace, monospace; }
  .num { font-variant-numeric: tabular-nums; }

  main { max-width: 1260px; margin: 0 auto; padding: 32px 16px 96px; }
  header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px; border-bottom: 1px solid var(--rule); padding-bottom: 16px; margin-bottom: 8px; }
  header.top h1 { font-size: 20px; font-weight: 600; font-stretch: 108%; margin: 0; letter-spacing: -0.01em; }
  header.top p { margin: 0; color: var(--fg-3); font-size: 13px; }
  .controls { margin-left: auto; display: flex; gap: 8px; }
  button { font: inherit; font-size: 12.5px; color: var(--fg-2); background: transparent; border: 1px solid var(--rule-2); border-radius: 5px; padding: 3px 10px; cursor: pointer; }
  button[aria-pressed=true] { color: var(--fg); border-color: var(--fg-3); background: var(--raise); }
  button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--fg-3); margin: 32px 0 12px; letter-spacing: 0.01em; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; }
  .grid > .wrap { max-width: 100%; overflow: hidden; }
  .note { color: var(--fg-3); font-size: 12.5px; max-width: 600px; margin: -4px 2px 14px; }
  .cap { color: var(--fg-3); font-size: 12.5px; line-height: 1.5; max-width: 600px; margin: 8px 2px 8px; }
  body.solo .cap { display: none; }

  /* a prototype cell: fixed size so every frame is the same box */
  .cell { position: relative; overflow: hidden; background: var(--bg); color: var(--fg); border: 1px solid var(--rule); border-radius: 10px; }
  .cell canvas { position: absolute; display: block; }
  .cell .hd { position: absolute; left: 20px; top: 16px; right: 20px; display: flex; align-items: baseline; gap: 10px; pointer-events: none; }
  .cell .hd b { font-weight: 560; font-size: 14px; font-stretch: 104%; }
  .cell .hd span { color: var(--fg-3); font-size: 12.5px; }
  .cell .hd i { margin-left: auto; font-style: normal; color: var(--fg-4); font-size: 11px; }
  .cell .ft { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; border-top: 1px solid var(--rule); }
  .cell .inl { position: absolute; left: 20px; top: 0; height: 56px; display: flex; align-items: center; gap: 8px; }
  .cell .inl canvas { position: relative; }
  .cell .inl .w { color: var(--signal); font-size: 14px; }
  .cell .inl .d { color: var(--fg-3); font-size: 12.5px; margin-left: 6px; }
  .cell .sizes { position: absolute; right: 20px; top: 0; height: 56px; display: flex; align-items: center; gap: 18px; }
  .cell .sizes canvas { position: relative; }

  /* solo mode: one cell, flush at the top left, for capture */
  body.solo { background: transparent; }
  body.solo main { padding: 0; max-width: none; }
  body.solo header.top, body.solo h2, body.solo .note { display: none; }
  body.solo .grid { display: block; }
  body.solo .wrap:not(.on) { display: none; }
  body.solo .cell { border: 0; border-radius: 0; }

  /* in context: chat pieces built to the spec (CHAT-AND-MOTION.md 2.4 to 2.6) */
  .ctx { font-size: 15px; line-height: 1.65; }
  .ctx .col { position: absolute; left: 50%; transform: translateX(-50%); }
  .ctx .bubble { background: var(--raise); border: 1px solid var(--rule); border-radius: 5px; padding: 9px 14px; color: var(--fg); max-width: 85%; margin-left: auto; width: fit-content; }
  .ctx .live { display: flex; align-items: center; gap: 9px; margin-top: 26px; height: 24px; }
  .ctx .live canvas { position: relative; }
  .ctx .live .w { color: var(--signal); font-size: 14px; }
  .ctx .live .s { color: var(--signal); font-size: 13px; opacity: 0.9; }
  .ctx .detail { color: var(--fg-3); font-size: 13px; margin: 2px 0 0 25px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctx .composer { background: var(--sunk); border: 1px solid var(--rule-2); border-radius: 5px; padding: 12px; }
  .ctx .composer .ph { color: var(--fg-4); font-size: 15px; height: 44px; }
  .ctx .bar { display: flex; align-items: center; gap: 12px; color: var(--fg-3); font-size: 13px; }
  .ctx .bar .sep { width: 1px; height: 14px; background: var(--rule); }
  .ctx .bar .send { margin-left: auto; width: 30px; height: 30px; border-radius: 5px; background: var(--fg); display: grid; place-items: center; opacity: 0.35; }
  .ctx .bar .send svg { stroke: var(--bg); }
  .ctx .greet { text-align: center; font-size: 26px; font-weight: 560; font-stretch: 104%; letter-spacing: -0.01em; color: var(--fg); }
  .ctx .recent { display: flex; gap: 18px; font-size: 12.5px; color: var(--fg-2); margin-top: 12px; padding-left: 2px; white-space: nowrap; }
  .ctx .recent span:first-child { color: var(--fg-3); }
  .ctx .topbar { position: absolute; left: 0; right: 0; top: 0; height: 48px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; padding: 0 20px; gap: 22px; font-size: 13px; color: var(--fg-3); }
  .ctx .topbar b { color: var(--fg); font-weight: 560; font-stretch: 104%; font-size: 14px; }
  .ctx .topbar .cur { color: var(--fg); }
  .ctx .rail { position: absolute; left: 0; top: 49px; bottom: 0; width: 200px; border-right: 1px solid var(--rule); padding: 14px 12px; font-size: 12.5px; color: var(--fg-2); }
  .ctx .rail .g { color: var(--fg-3); font-weight: 600; font-size: 12px; margin: 14px 0 6px; }
  .ctx .rail .r { padding: 5px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctx .rail .new { border: 1px solid var(--rule-2); border-radius: 5px; padding: 4px 8px; color: var(--fg); width: fit-content; }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Shapes and marks</h1>
    <p>Round two. Live states built from geometry and strokes. No dots.</p>
    <div class="controls">
      <button id="bPause" aria-pressed="false">Pause</button>
      <button id="bRM" aria-pressed="false">Reduce motion</button>
    </div>
  </header>
  <div id="root"></div>
</main>
<script>
'use strict';
/* ---------------------------------------------------------------------- */
/* math                                                                    */
/* ---------------------------------------------------------------------- */
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const mod = (x, m) => ((x % m) + m) % m;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function bez(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (u) => ((ax * u + bx) * u + cx) * u, sy = (u) => ((ay * u + by) * u + cy) * u;
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let lo = 0, hi = 1, u = x;
    for (let i = 0; i < 40; i++) { const v = sx(u); if (Math.abs(v - x) < 1e-6) break; if (v < x) lo = u; else hi = u; u = (lo + hi) / 2; }
    return sy(u);
  };
}
// curves: --ease, --ease-in, --ease-sine from motion.css; morph is a firmer in-out for shape changes
const E = {
  out: bez(0.2, 0.7, 0.2, 1),
  in: bez(0.4, 0, 1, 1),
  sine: bez(0.37, 0, 0.63, 1),
  morph: bez(0.6, 0, 0.25, 1),
  inout: bez(0.65, 0, 0.35, 1),
};

/* ---------------------------------------------------------------------- */
/* palettes                                                                */
/* ---------------------------------------------------------------------- */
const hexRGB = (h) => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
function pal(o) { const p = { ...o, rgb: {} }; for (const k in o) if (typeof o[k] === 'string' && o[k][0] === '#') p.rgb[k] = hexRGB(o[k]); return p; }
const PAL = {
  dark: pal({ dark: true, bg: '#0e0e10', sunk: '#08080b', raise: '#151518', rule: '#242428', rule2: '#36363b', fg: '#ececef', fg2: '#b2b2b8', fg3: '#828289', fg4: '#626269', signal: '#c6a2f7', warn: '#f2be62', fault: '#f1756c', ok: '#71d29d' }),
  light: pal({ dark: false, bg: '#f9f9fa', sunk: '#f1f1f4', raise: '#ffffff', rule: '#dfdfe3', rule2: '#c3c3c9', fg: '#17171c', fg2: '#48484f', fg3: '#686870', fg4: '#85858c', signal: '#7a4aba', warn: '#a66000', fault: '#cc3430', ok: '#007e46' }),
};
const rgbStr = (c, a = 1) => a >= 1 ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixRGB = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const mix = (P, a, b, t) => rgbStr(mixRGB(P.rgb[a] || hexRGB(a), P.rgb[b] || hexRGB(b), t));
const col = (P, k, a = 1) => rgbStr(P.rgb[k], a);

/* ---------------------------------------------------------------------- */
/* shape helpers                                                           */
/* ---------------------------------------------------------------------- */
function polyVerts(n, r, rot = -Math.PI / 2) { return Array.from({ length: n }, (_, k) => { const a = rot + k * TAU / n; return [r * Math.cos(a), r * Math.sin(a)]; }); }
function starVerts(n, r1, r2, rot = -Math.PI / 2) { const v = []; for (let k = 0; k < n; k++) { let a = rot + k * TAU / n; v.push([r1 * Math.cos(a), r1 * Math.sin(a)]); a += TAU / (2 * n); v.push([r2 * Math.cos(a), r2 * Math.sin(a)]); } return v; }
// distance from the origin to a star-shaped polygon along a ray
function rayPoly(v, ang) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  for (let i = 0; i < v.length; i++) {
    const a = v[i], b = v[(i + 1) % v.length], ex = b[0] - a[0], ey = b[1] - a[1];
    const den = dx * ey - dy * ex; if (Math.abs(den) < 1e-12) continue;
    const r = (a[0] * ey - a[1] * ex) / den, s = (a[0] * dy - a[1] * dx) / den;
    if (r > 0 && s >= -1e-9 && s <= 1 + 1e-9) return r;
  }
  return 0;
}
function radial(v, M) { const o = new Float32Array(M); for (let j = 0; j < M; j++) o[j] = rayPoly(v, j * TAU / M); return o; }
function pathRadial(ctx, r, rot, R, cx = 0, cy = 0) {
  const M = r.length; ctx.beginPath();
  for (let j = 0; j < M; j++) { const a = j * TAU / M + rot; const x = cx + r[j] * R * Math.cos(a), y = cy + r[j] * R * Math.sin(a); j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.closePath();
}
// 3x3 rotations; x right, y down, z toward the viewer
const rotX = (a) => { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; };
const rotY = (a) => { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; };
const rotZ = (a) => { const c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1]; };
const mmul = (A, B) => { const o = new Array(9); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) o[i * 3 + j] = A[i * 3] * B[j] + A[i * 3 + 1] * B[3 + j] + A[i * 3 + 2] * B[6 + j]; return o; };
const mapp = (M, v) => [M[0] * v[0] + M[1] * v[1] + M[2] * v[2], M[3] * v[0] + M[4] * v[1] + M[5] * v[2], M[6] * v[0] + M[7] * v[1] + M[8] * v[2]];
const lw = (s, k = 0.016, min = 1.3, max = 3) => clamp(1 + s * k, min, max);

/* ---------------------------------------------------------------------- */
/* 1. Septa: a seven-sided mark that turns into a star, a circle, and back */
/* ---------------------------------------------------------------------- */
// every shape is 14 half-edges of Q points, so polygon and star stay straight-edged mid-morph
const SEPTA = (() => {
  const Q = 18, M = 14 * Q, ang = (k) => -Math.PI / 2 + (k * TAU) / 14, pol = (r, a) => [r * Math.cos(a), r * Math.sin(a)];
  const build = (vert) => { const o = new Float32Array(2 * M); for (let k = 0; k < 14; k++) { const A = vert(k), B = vert(k + 1); for (let q = 0; q < Q; q++) { const f = q / Q, i = 2 * (k * Q + q); o[i] = lerp(A[0], B[0], f); o[i + 1] = lerp(A[1], B[1], f); } } return o; };
  const hv = (k) => (k % 2 === 0 ? pol(1, ang(k)) : (() => { const a = pol(1, ang(k - 1)), b = pol(1, ang(k + 1)); return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; })());
  const H = build(hv), S = build((k) => (k % 2 === 0 ? pol(1, ang(k)) : pol(0.5, ang(k))));
  const C = new Float32Array(2 * M); for (let k = 0; k < 14; k++) for (let q = 0; q < Q; q++) { const p = pol(0.84, ang(k + q / Q)), i = 2 * (k * Q + q); C[i] = p[0]; C[i + 1] = p[1]; }
  return { M, H, S, C };
})();
const SEPTA_L = 3000;
const mixXY = (a, b, k) => { const o = new Float32Array(a.length); for (let i = 0; i < a.length; i++) o[i] = a[i] + (b[i] - a[i]) * k; return o; };
function septaPose(t) {
  t = mod(t, SEPTA_L);
  const tabs = [SEPTA.H, SEPTA.S, SEPTA.C, SEPTA.H];
  const rots = [0, TAU / 14, TAU / 14 + TAU / 28, TAU / 7];
  const i = Math.min(2, Math.floor(t / 1000)), u = t - i * 1000;
  const k = u < 300 ? 0 : E.morph((u - 300) / 700);
  return { xy: mixXY(tabs[i], tabs[i + 1], k), rot: lerp(rots[i], rots[i + 1], k) };
}
function pathXY(ctx, xy, rot, R, cx = 0, cy = 0) {
  const c = Math.cos(rot), s = Math.sin(rot); ctx.beginPath();
  for (let i = 0; i < xy.length; i += 2) { const x = cx + (xy[i] * c - xy[i + 1] * s) * R, y = cy + (xy[i] * s + xy[i + 1] * c) * R; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.closePath();
}
function drawSeptaShape(ctx, pose, R, s, stroke, fillA, w, cx = 0, cy = 0) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  pathXY(ctx, pose.xy, pose.rot, R, cx, cy);
  if (fillA > 0) { ctx.fillStyle = rgbStr(stroke, fillA); ctx.fill(); }
  ctx.strokeStyle = rgbStr(stroke); ctx.lineWidth = w ?? lw(s, 0.012, 1.35, 2.6); ctx.stroke();
}
function drawSepta(ctx, t, s, P) {
  drawSeptaShape(ctx, septaPose(t), s * 0.4, s, P.rgb.signal, P.dark ? 0.1 : 0.08);
}

/* ---------------------------------------------------------------------- */
/* 2. Knot: one line writes a trefoil, holds, and lets go                   */
/* ---------------------------------------------------------------------- */
const KNOT = (() => {
  const n = 3000, raw = [];
  for (let i = 0; i <= n; i++) { const u = (i / n) * TAU; raw.push([Math.sin(u) + 2 * Math.sin(2 * u), Math.cos(u) - 2 * Math.cos(2 * u), -Math.sin(3 * u)]); }
  const cum = [0]; for (let i = 1; i <= n; i++) cum.push(cum[i - 1] + Math.hypot(raw[i][0] - raw[i - 1][0], raw[i][1] - raw[i - 1][1], 0.35 * (raw[i][2] - raw[i - 1][2])));
  const total = cum[n], K = 720, pts = []; let j = 0;
  for (let k = 0; k < K; k++) { const tg = (k / K) * total; while (cum[j + 1] < tg) j++; const f = (tg - cum[j]) / (cum[j + 1] - cum[j]); const a = raw[j], b = raw[j + 1]; pts.push([lerp(a[0], b[0], f) / 3, lerp(a[1], b[1], f) / 3, lerp(a[2], b[2], f)]); }
  return { pts, K };
})();
const KNOT_L = 3000;
function knotAt(f) { const K = KNOT.K, x = mod(f, 1) * K, i = Math.floor(x), u = x - i, a = KNOT.pts[i % K], b = KNOT.pts[(i + 1) % K]; return [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)]; }
function knotSpan(t) {
  t = mod(t, KNOT_L);
  const d = E.morph(seg(t, 0, 1300)), e = E.morph(seg(t, 1500, 2850));
  const OFF = 0.5; // start on a lobe
  return { head: OFF + 0.1 + 0.9 * d + 0.1 * e, tail: OFF + 0.1 * d + 0.9 * e };
}
function drawStrand(ctx, segs, w, P, haloK = 2.9) {
  segs.sort((a, b) => a.z - b.z);
  const bg = P.bg;
  for (const g of segs) {
    ctx.lineCap = 'butt'; ctx.strokeStyle = bg; ctx.lineWidth = w * haloK;
    ctx.beginPath(); ctx.moveTo(g.a[0], g.a[1]); ctx.lineTo(g.b[0], g.b[1]); ctx.stroke();
    ctx.lineCap = 'round'; ctx.strokeStyle = g.c; ctx.lineWidth = g.w;
    ctx.beginPath(); ctx.moveTo(g.a[0], g.a[1]); ctx.lineTo(g.b[0], g.b[1]); ctx.stroke();
  }
}
function drawKnot(ctx, t, s, P) {
  const R = s * 0.42, w = lw(s, 0.014, 1.4, 3);
  const { head, tail } = knotSpan(t);
  const K = KNOT.K, segs = [];
  const len = head - tail;
  // the whole knot as a hairline guide, so the mark is always there and the pen inks it
  ctx.beginPath(); for (let i = 0; i <= K; i++) { const p = KNOT.pts[i % K]; i ? ctx.lineTo(p[0] * R, p[1] * R) : ctx.moveTo(p[0] * R, p[1] * R); }
  ctx.strokeStyle = col(P, 'rule2', s < 40 ? 0.9 : 1); ctx.lineWidth = s < 40 ? 0.8 : 1; ctx.lineJoin = 'round'; ctx.stroke();
  let f0 = tail;
  while (f0 < head - 1e-9) {
    const f1 = Math.min(head, (Math.floor(f0 * K + 1e-9) + 1) / K);
    const a = knotAt(f0), b = knotAt(f1), z = (a[2] + b[2]) / 2;
    const fromTail = (f0 - tail), toHead = head - f1;
    const taper = (0.2 + 0.8 * smooth(0, Math.min(0.14, len * 0.5), fromTail)) * (0.75 + 0.25 * smooth(0, 0.02, toHead));
    const depth = (z + 1) / 2;
    segs.push({ a: [a[0] * R, a[1] * R], b: [b[0] * R, b[1] * R], z, w: w * taper, c: rgbStr(mixRGB(P.rgb.bg, P.rgb.signal, 0.42 + 0.58 * depth)) });
    f0 = f1;
  }
  drawStrand(ctx, segs, w, P, s < 40 ? 2.2 : 2.9);
}

/* ---------------------------------------------------------------------- */
/* 3. Spoke: an asterisk of seven arms that grow in turn, then turn and rest */
/* ---------------------------------------------------------------------- */
const SPOKE_L = 2500;
const SPOKE_LEN = [1, 0.74, 0.9, 0.68, 0.95, 0.72, 0.86];
function spokePose(t, s = 200) {
  t = mod(t, SPOKE_L);
  // at rest the arms pull in to a small asterisk; at 16 to 24 px it stays big enough to read as one
  const seed = s < 40 ? 0.62 : 0.36, arms = [];
  const back = E.inout(seg(t, 1450, 2050));
  for (let i = 0; i < 7; i++) {
    const g = E.out(seg(t, 90 * i, 90 * i + 460));
    arms.push(lerp(lerp(seed, SPOKE_LEN[i], g), seed, back));
  }
  return { arms, rot: (TAU / 7) * back };
}
function drawSpoke(ctx, t, s, P, pose) {
  pose = pose || spokePose(t, s);
  const R = s * 0.44, w = clamp(s * 0.055, 2, 11), wb = w * 0.42, wt = Math.max(0.75, w * 0.3);
  ctx.fillStyle = P.signal;
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI / 2 + (i * TAU) / 7 + pose.rot, r = (R - wt) * pose.arms[i];
    ctx.save(); ctx.rotate(a); ctx.beginPath();

/* ---------------------------------------------------------------------- */

/* ---------------------------------------------------------------------- */
/* 5. Fold: a square sheet folds in half, in half again, then opens         */
/* ---------------------------------------------------------------------- */

/* ---------------------------------------------------------------------- */

/* ---------------------------------------------------------------------- */

/* ---------------------------------------------------------------------- */

/* ---------------------------------------------------------------------- */
const THINK = [

const root = document.getElementById('root');

// thinking cells, dark and light
function thinkCell(grid, m, theme) {

  const cell = addCell(grid, id, theme, W, H);
  cell.innerHTML = `<div class="hd"><b>${m.name}</b><span>Thinking</span><i class="mono">${(m.loop / 1000).toFixed(1)}s loop</i></div><div class="ft"><div class="inl"></div><div class="sizes"></div></div>`;

const gThinkL = section('Thinking, light theme');

<script>

/* ---------------------------------------------------------------------- */
/* live states: full-cell canvases                                         */

}

const TURN_WORDS = [
  [0, { text: 'Thinking' }],
  [3000, { text: 'Searching the web', detail: 'caddy tailscale certs', mono: true }],
  [5000, { text: 'Thinking' }],

/* ---- Septa fault: thinking, then failed, then retry -------------------- */

/* ---- Lens: searching the web ------------------------------------------- */

/* ---- Mesh: a tool is running ------------------------------------------- */
const MESH_L = 2000;

}

  const ax = 248, ay = 152, bx = ax + rpA + rpB, by = ay;

/* ---- Dial: a limit is reached, counting down to resume ------------------ */
const DIAL_L = 9000;
function drawDial(ctx, t, w, h, P) {
  const cx = w / 2, cy = 150, n = 60, rin = 80, rout = 92;
  // the ring is the wait: full when the limit hits, empty at the reset. Here one second takes ten ticks.
  const sec = Math.min(6, Math.floor(t / 1000)), lit = 60 - 10 * sec, k0 = t - sec * 1000;
  const back = seg(t, 8400, 8800); // everything returns to the start
  ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (i * TAU) / n;
    let c = P.rgb.rule2, len = 0;
    if (t < 6350) {
      if (i < lit) c = P.rgb.fg3;
      // the ten ticks of the second that just ended go out from the end backwards, 18 ms apart
      if (sec > 0 && i >= lit && i < lit + 10) { const q = E.out(seg(k0, (lit + 9 - i) * 18, (lit + 9 - i) * 18 + 140)); c = mixRGB(P.rgb.fg3, P.rgb.rule2, q); }
      // the head of the wait is brighter and a little longer
      if (i === lit - 1) { const q = sec > 0 ? E.out(seg(k0, 160, 320)) : 1; c = mixRGB(P.rgb.fg3, P.rgb.fg, q); len = 4 * q; }
    } else {
      // reset: the ring fills violet clockwise, holds, then dims while the work resumes
      const q = E.out(seg(t, 6350 + i * 8, 6350 + i * 8 + 160));
      c = mixRGB(P.rgb.rule2, P.rgb.signal, q * (1 - 0.75 * E.inout(seg(t, 7000, 7600))));
      if (back > 0) { const init = i === 59 ? P.rgb.fg : P.rgb.fg3; c = mixRGB(c, init, E.out(seg(back, i / 120, i / 120 + 0.5))); len = i === 59 ? 4 * back : 0; }
    }
    ctx.strokeStyle = rgbStr(c); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * rin, cy + Math.sin(a) * rin); ctx.lineTo(cx + Math.cos(a) * (rout + len), cy + Math.sin(a) * (rout + len)); ctx.stroke();
  }
  // the digits: only the one that changes rolls up, inside its own cell
  const font = `500 30px ${MONO}`;
  const numA = t < 6000 ? 1 : t < 8400 ? 1 - seg(t, 6000, 6150) : back;
  if (numA > 0) {
    const cw = tw(ctx, '0', font), x0 = cx - (cw * 4) / 2;
    txt(ctx, '0:0', x0, cy - 6, { font, color: P.fg, alpha: numA });
    const rolling = t < 6000 && t >= 1000, k = rolling ? E.out(seg(t % 1000, 0, 240)) : 1;
    const rem = 6 - sec, cur = String(t < 6000 ? rem : t < 7000 ? 0 : 6), prev = String(rem + 1);
    ctx.save(); ctx.beginPath(); ctx.rect(x0 + cw * 3 - 2, cy - 30, cw + 4, 48); ctx.clip();
    if (rolling && k < 1) txt(ctx, prev, x0 + cw * 3, cy - 6 - 14 * k, { font, color: P.fg, alpha: 1 - k });
    txt(ctx, cur, x0 + cw * 3, cy - 6 + (rolling ? 14 * (1 - k) : 0), { font, color: P.fg, alpha: numA * k });
    ctx.restore();
    txt(ctx, 'Resumes at 15:42', cx, cy + 26, { font: `450 12.5px ${SANS}`, color: P.fg3, align: 'center', alpha: numA });
  }
  // after the reset the work resumes: the thinking mark takes the center
  const mA = seg(t, 6450, 6750) * (1 - seg(t, 8100, 8350));
  if (mA > 0) { ctx.save(); ctx.globalAlpha = mA; inMark(ctx, cx, cy, 64, (s) => drawSepta(ctx, t - 6450, s, P)); ctx.restore(); }
  footer(ctx, P, w, h);
  const L = (d) => ({ text: 'Limit reached', color: 'fg3', detail: d, dcolor: 'fg3' });
  const words = [[0, L('Resumes in 6s')], [1000, L('Resumes in 5s')], [2000, L('Resumes in 4s')], [3000, L('Resumes in 3s')], [4000, L('Resumes in 2s')], [5000, L('Resumes in 1s')], [6350, { text: 'Thinking', detail: 'Resumed after the Claude Max reset' }], [8400, L('Resumes in 6s')]];
  swapLine(ctx, P, words, t, DIAL_L, 20, h - 28);
}

/* ---- Jury: three models answer, a judge decides ------------------------ */
const JURY_L = 7500;
const JURORS = [
  { n: 3, x: 180, name: 'Sonnet 5.5', done: 2000, off: 160 },
  { n: 4, x: 300, name: 'GPT-5.5', done: 1500, off: 0 },
  { n: 5, x: 420, name: 'Gemini 3 Pro', done: 2320, off: 320 },
];
const JURY_PICK = 1, JY = 222, JR = 20, JUDGE = [300, 88];
function jurorRot(j, t) {
  const tt = Math.min(t, j.done) - j.off; if (tt < 0) return 0;
  const k = Math.floor(tt / 500), u = E.inout(seg(tt - k * 500, 0, 300));
  return ((k + u) * TAU) / j.n;
}
function regPoly(ctx, n, r, rot, cx, cy) { ctx.beginPath(); for (let i = 0; i <= n; i++) { const a = -Math.PI / 2 + rot + (i * TAU) / n; const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.closePath(); }

  ctx.save(); ctx.globalAlpha = alpha;
  const verdict = E.out(seg(t, 4400, 4700));
  const judging = t >= 2600 && t < 4400;
  ctx.lineCap = 'round';
  JURORS.forEach((j, idx) => {
    const x1 = JUDGE[0] + (j.x - JUDGE[0]) * 0.18, y1 = JUDGE[1] + 34, x2 = j.x, y2 = JY - JR - 10;
    ctx.strokeStyle = P.rule; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    // an answer travels up its wire when a juror finishes
    const up = E.inout(seg(t, j.done + 120, j.done + 520));
    if (up > 0) {
      ctx.strokeStyle = mix(P, 'fg3', 'rule', idx === JURY_PICK ? 0 : verdict); ctx.lineWidth = 1.25;
      ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(lerp(x2, x1, up), lerp(y2, y1, up)); ctx.stroke();
    }

        ctx.beginPath(); ctx.moveTo(lerp(x2, x1, f1), lerp(y2, y1, f1)); ctx.lineTo(lerp(x2, x1, f0), lerp(y2, y1, f0)); ctx.stroke();
      }
    }
    if (idx === JURY_PICK && verdict > 0) {
      ctx.strokeStyle = P.signal; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(lerp(x1, x2, verdict), lerp(y1, y2, verdict)); ctx.stroke();
    }
  });
  JURORS.forEach((j, idx) => {
    const fin = E.out(seg(t, j.done, j.done + 240));
    let c = mixRGB(P.rgb.signal, P.rgb.fg2, fin), fill = 0;
    if (verdict > 0) { if (idx === JURY_PICK) { c = mixRGB(c, P.rgb.signal, verdict); fill = 0.12 * verdict; } else c = mixRGB(c, P.rgb.fg4, verdict); }
    ctx.lineJoin = 'round'; regPoly(ctx, j.n, JR, jurorRot(j, t), j.x, JY);

    const nameC = idx === JURY_PICK ? mix(P, 'fg3', 'fg', verdict) : mix(P, 'fg3', 'fg4', verdict);
    txt(ctx, j.name, j.x, JY + JR + 22, { font: `400 11.5px ${MONO}`, color: nameC, align: 'center' });
  });

  const jc = t < 2600 ? P.rgb.fg3 : t < 4400 ? mixRGB(P.rgb.fg3, P.rgb.signal, E.out(seg(t, 2600, 2840))) : mixRGB(P.rgb.signal, P.rgb.fg, verdict);
  let jp = { xy: SEPTA.H, rot: 0 };
  if (judging) jp = septaPose(t - 2600);
  if (t >= 4400) jp = poseCoast(septaPose(1800), { xy: SEPTA.H, rot: TAU / 7 }, E.out(seg(t, 4400, 4760)));
  drawSeptaShape(ctx, jp, 24, 60, jc, judging ? (P.dark ? 0.1 : 0.08) : 0, 1.75, JUDGE[0], JUDGE[1]);
  txt(ctx, 'Judge', JUDGE[0] + 40, JUDGE[1], { font: `400 11.5px ${MONO}`, color: P.fg3 });
  ctx.restore();
}

  const back = seg(t, 6700, 7300);

  else juryFrame(ctx, t, w, h, P, 1);

    [0, { text: 'Jury', detail: 'Waiting for 3 of 3 jurors' }],
    [1500, { text: 'Jury', detail: 'Waiting for 2 of 3 jurors' }],
    [2000, { text: 'Jury', detail: 'Waiting for 1 of 3 jurors' }],
    [2600, { text: 'Judging', detail: 'Opus 5.5 reads three answers' }],

/* ---- Relay: one model hands the work to another ------------------------ */
const RELAY_L = 6000;
const RA = [170, 162], RB = [430, 162], RC = [300, 40];

function drawRelay(ctx, t, w, h, P) {
  const half = t < 3000 ? 0 : 1, tt = t - half * 3000;
  const from = half ? RB : RA, to = half ? RA : RB;
  const fly = E.inout(seg(tt, 1200, 2300));
  // the route
  ctx.beginPath(); for (let i = 0; i <= 60; i++) { const q = qbez(RA, RC, RB, i / 60); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }
  ctx.setLineDash([2, 5]); ctx.strokeStyle = P.rule2; ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]);
  // a violet trail draws behind the mark and fades after it lands
  if (tt > 1200 && tt < 2900) {
    const fade = 1 - seg(tt, 2300, 2900), n = 80;
    ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const k0 = (i / n) * fly, k1 = ((i + 1) / n) * fly;
      const a = qbez(from, RC, to, k0), b = qbez(from, RC, to, k1);
      ctx.strokeStyle = col(P, 'signal', Math.pow((i + 1) / n, 2.2) * fade); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
  }
  // stations: a faint outline where a mark can sit, opaque so the route starts at its edge
  [RA, RB].forEach((p) => { pathXY(ctx, SEPTA.H, 0, 26, p[0], p[1]); ctx.fillStyle = P.bg; ctx.fill(); drawSeptaShape(ctx, { xy: SEPTA.H, rot: 0 }, 26, 60, P.rgb.rule2, 0, 1, p[0], p[1]); });
  // the mark: thinks at its station, packs into a circle for the trip, opens at the other end
  let pose, p;
  // each half starts where the last one left off (pose 700 ms into the loop), so the loop has no jump
  if (tt < 1200) { pose = septaPose(tt + 700); p = from; }
  else if (tt < 2300) {
    const start = septaPose(1900);
    const mid = { xy: SEPTA.C, rot: start.rot };
    pose = fly < 0.5 ? poseCoast(start, mid, E.out(fly * 2)) : poseCoast(mid, { xy: SEPTA.H, rot: 0 }, E.inout((fly - 0.5) * 2));
    p = qbez(from, RC, to, fly);
  } else { pose = septaPose(mod(tt - 2300, 3000)); p = to; }
  const scale = tt >= 1200 && tt < 2300 ? 1 - 0.32 * Math.sin(Math.PI * fly) : 1;
  pathXY(ctx, pose.xy, pose.rot, 26 * scale, p[0], p[1]); ctx.fillStyle = P.bg; ctx.fill();
  drawSeptaShape(ctx, pose, 26 * scale, 60, P.rgb.signal, P.dark ? 0.1 : 0.08, 1.75, p[0], p[1]);
  // names trade brightness as the work arrives
  const arrive = E.out(seg(tt, 2150, 2400));
  const aOn = half ? arrive : 1 - arrive, bOn = 1 - aOn;
  txt(ctx, 'Sonnet 5.5', RA[0], RA[1] + 50, { font: `500 14px ${SANS}`, color: mix(P, 'fg4', 'fg', aOn), align: 'center' });
  txt(ctx, 'GPT-5.5', RB[0], RB[1] + 50, { font: `500 14px ${SANS}`, color: mix(P, 'fg4', 'fg', bOn), align: 'center' });
  footer(ctx, P, w, h);
  const words = [
    [0, { text: 'Thinking', detail: 'Sonnet 5.5', dcolor: 'fg3' }],
    [1200, { text: 'Handing off', detail: 'to GPT-5.5 with 14.2K tokens of context' }],
    [2350, { text: 'Thinking', detail: 'GPT-5.5', dcolor: 'fg3' }],
    [4200, { text: 'Handing off', detail: 'to Sonnet 5.5 with 15.1K tokens of context' }],
    [5350, { text: 'Thinking', detail: 'Sonnet 5.5', dcolor: 'fg3' }],
  ];
  swapLine(ctx, P, words, t, RELAY_L, 20, h - 28);
}

function liveCell(grid, m, theme) {

<script>
'use strict';
/* ---------------------------------------------------------------------- */
/* clock: live in the browser, or driven from outside with __render(t)     */
/* ---------------------------------------------------------------------- */
let paused = false, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || params.get('rm') === '1';

  SCENES.forEach((s) => io.observe(s.el));
}
window.__scenes = SCENES.map(({ id, w, h, loop }) => ({ id, w, h, loop }));

if (tParam !== null) { window.__ready.then(() => window.__render(Number(tParam))); }
else {
  const t0 = performance.now();
  let tp = 0;
  const loop = (now) => {
    if (!paused) tp = now - t0;
    if (!document.hidden) for (const s of visible) s.render(reduce ? s.still : mod(tp, s.loop));
