  const items = o.items || NAV;

  bar.innerHTML = `<div class="brand">${MARK}<span>Conclave</span></div><nav class="nav">${items.map((n) => `<span class="it${n === active ? ' on' : ''}" data-n="${n}">${n}${o.counts && o.counts[n] != null ? `<span class="cnt${o.warn === n ? ' warn' : ''}">${o.counts[n]}</span>` : ''}</span>`).join('')}</nav>`;
  return bar;
}
const CUR = '<svg width="20" height="24" viewBox="0 0 20 24"><path d="M3 2.2v16.3l4.1-3.9 2.6 6.1 2.9-1.2-2.6-6h5.8z" fill="#fff" stroke="#16161a" stroke-width="1.3" stroke-linejoin="round"/></svg>';
function cursor(st) {
  const c = el('div', 'cur', st); c.innerHTML = CUR;
  return (t, keys, clicks = []) => {
    const [x, y] = kf(t, keys);
    let pr = 0;
    for (const ck of clicks) { const d = t - ck; if (d >= 0 && d < 220) pr = Math.max(pr, d < 70 ? d / 70 : 1 - (d - 70) / 150); }
    c.style.transform = `translate(${(x - 3).toFixed(2)}px,${(y - 2.2).toFixed(2)}px) scale(${(1 - 0.12 * pr).toFixed(3)})`;
  };
}

    const status = { A: [[0, 1]], B: [[0, 0]], D: [[0, 0]], E: [[0, 0]], C: [[0, 0], [1700, 1], [4000, 0]], N: [[0, 1], [2700, 2]] };

      }
      runRoll(t, [[0, 0], [500, 1], [1700, 2], [2700, 1], [4000, 0]]);
    };
  },
});

    const N = 180, X0 = 44, X1 = 596, LY = 240;
    const MX0 = CX, MY0 = CY + R, MX1 = X0 + L / 2, MY1 = LY;

      const ph = Math.max(0, (t - U2 - U2D) / 1400) % 1, hx = lerp(X0 - 60, X1 + 60, E.sine(ph));

    const real = D.map((d, i) => add(st, `<div class="row" style="top:${100 + i * 44}px;opacity:0"><span style="width:14px;height:14px;display:grid">${d[3] ? '<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="4.6" fill="none" stroke="var(--signal)" stroke-width="1.6" opacity=".35"/><path d="M7 2.4a4.6 4.6 0 0 1 4.6 4.6" fill="none" stroke="var(--signal)" stroke-width="1.6" stroke-linecap="round"/></svg>' : '<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="4.6" fill="none" stroke="var(--fg-4)" stroke-width="1.2"/></svg>'}</span><span>${d[0]}</span><span class="f3" style="margin-left:auto;font-size:12.5px;font-weight:400">${d[1]}</span><span class="${d[3] ? 'sig' : 'f4'}" style="width:70px;text-align:right;font-size:12.5px;font-weight:400">${d[2]}</span></div>`));
    return (t) => {
      const PASS = [[200, 1500], [1850, 1500]], IN = 3450, OUT = 5000;
      let bx = -9999;
      for (const [s, d] of PASS) if (t >= s && t < s + d) bx = lerp(-260, 900, E.sine((t - s) / d));
      if (t >= OUT + 100) { const s = OUT + 700, d = 1500; if (t >= s) bx = lerp(-260, 900, E.sine(cl((t - s) / d))); }
      const off = bx - 640;
      bars.forEach((b) => { b.e.style.backgroundPosition = `${(off - b.x).toFixed(1)}px ${-b.y}px`; });
      real.forEach((r, i) => {
        const a = t < OUT ? P(t, IN + i * 40, 240) : 1 - P(t, OUT + i * 25, 160, E.in);
        O(r, a); r.style.transform = `translateY(${(3 * (1 - (t < OUT ? a : 1))).toFixed(2)}px)`;
        O(skr[i], t < OUT ? 1 - P(t, IN + i * 40, 200, E.in) : P(t, OUT + 60 + i * 25, 200));
      });
    };
  },
});

      `<div class="a it" style="left:${X}px;top:78px;font-size:22px;font-weight:600;font-stretch:106%;letter-spacing:-.02em;line-height:1">Pair a device</div>

      `<svg class="a it" style="left:${X}px;top:76px;overflow:visible" width="48" height="48" viewBox="0 0 48 48"><circle class="dc" cx="24" cy="24" r="22" fill="none" stroke="var(--ok)" stroke-width="2" stroke-linecap="round" transform="rotate(-90 24 24)"/><path class="dk" d="M15 24.5 21.5 31 33 18" fill="none" stroke="var(--ok)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>

    ];
    const pages = content.map((h) => { const p = el('div', 'a', st, 'left:0;top:0;width:640px;height:400px;opacity:0', h); return { p, its: [...p.querySelectorAll('.it')] }; });
    const dc = pages[3].p.querySelector('.dc'), dk = pages[3].p.querySelector('.dk');
    const back = add(st, `<div class="btn" style="left:${X}px;top:340px;width:64px">Back</div>`);

      });

      // rail
      const fade = 1 - rk;
      rail.forEach((r, i) => {
        const done = i < 3 ? (t >= CL[i] ? P(t, CL[i], 200, E.out) : 0) : t >= CL[2] ? P(t, CL[2] + 260, 200) : 0;

        r.o.setAttribute('stroke', mix('var(--rule-2)', 'var(--fg)', curK));
        r.lab.style.color = mix('var(--fg-3)', 'var(--fg)', act);
        if (r.lf) { r.lf.style.transform = `scaleY(${(t >= CL[i] ? P(t, CL[i] + 120, 260, E.std) : 0).toFixed(4)})`; r.lf.style.opacity = fade.toFixed(3); }
      });
      O(back, step === 0 || step === 3 ? (reset ? P(t, RS + 120, 200) * 0.4 : step === 3 ? 0.4 * (1 - P(t, CL[2], 120)) : 0.4) : 1);
      btsw(t, [[0, 0], [CL[2] + 100, 1], [RS + 60, 0]]);
      srr(t, [[0, 0], [CL[0], 1], [CL[1], 2], [CL[2], 3], [RS, 0]]);
      cur(t, keys, CL);

  },
});

let readyResolve; window.__ready = new Promise((r) => { readyResolve = r; });
window.__scenes = S.map((s) => ({ id: s.id, name: s.name, loop: s.loop, w: 640, h: 36 + (s.h || 400) }));
(async () => {
  await Promise.all([document.fonts.load('500 13px "Mona Sans Variable"'), document.fonts.load('600 13px "Mona Sans Variable"'), document.fonts.load('400 12px "JetBrains Mono Variable"')]);
  await document.fonts.ready;
  const grid = document.getElementById('grid');
  const live = [];
  S.forEach((s, i) => {
    if (SOLO && SOLO !== s.id) return;
    const wrap = el('div', 'wrap' + (SOLO === s.id ? ' on' : ''), grid);
    const cell = el('section', 'cell', wrap);
    cell.setAttribute('aria-label', s.name);
    cell.innerHTML = `<div class="lbl"><span class="no">${String(i + 1).padStart(2, '0')}</span><span class="nm">${s.name}</span><span class="ds">${s.ds}</span></div>`;
    const st = el('div', 'stage', cell, `height:${s.h || 400}px`);
    el('p', 'cap', wrap, '', `${s.for} ${s.moves}`);
    const render = s.build(st);
    live.push({ s, render, cell, vis: true });
  });
  if (SOLO) document.body.classList.add('solo');
  const t0q = Number(Q.get('t') || 0);
  live.forEach((l) => l.render(t0q % l.s.loop));
  window.__render = (t) => live.forEach((l) => l.render(((t % l.s.loop) + l.s.loop) % l.s.loop));
  if (!SOLO || Q.get('play')) {
    const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const io = new IntersectionObserver((es) => es.forEach((e) => { const l = live.find((x) => x.cell === e.target); if (l) l.vis = e.isIntersecting; }));
    live.forEach((l) => io.observe(l.cell));
    let start = performance.now();
    document.getElementById('replay').onclick = () => { start = performance.now(); };
    document.getElementById('theme').onclick = (ev) => {
      const r = document.documentElement; const light = r.dataset.theme !== 'light';
      r.dataset.theme = light ? 'light' : 'dark'; ev.target.textContent = light ? 'Dark theme' : 'Light theme';
    };
    const frame = (now) => {
      if (!rm) live.forEach((l) => { if (l.vis && !document.hidden) l.render((now - start) % l.s.loop); });
      requestAnimationFrame(frame);
    };
    if (!rm) requestAnimationFrame(frame);
  }
  readyResolve(true);
})();
